<!DOCTYPE html>
<!--
  新标签页。桌面端与移动端**共用这一份**：
    桌面端  file:///…/src/renderer/newtab.html
    移动端  file:///android_asset/newtab.html  ← 由 npm run mobile:sync 逐字节复制

  为什么要共用而不是各写一份：这一页的规则（怎么排序、去重、上限几格、磁贴什么颜色）
  全是「看一眼就知道对不对」的展示逻辑，但一旦分成两份实现，改一边忘一边的表现是
  「手机上少了两个图标」——没人会为此开一个 issue。共用一份源，靠既有那条
  sha256 同步门禁（tools/check-mobile-sync.js）保证两边永远一致。

  这一页刻意**不依赖任何外部文件**：不引 CSS、不引图片、不引字体。
  理由有二：
    1) file:// 下相对路径在两端指向不同的目录（安卓是 assets/，桌面是 src/renderer/），
       共用一份源就没法写一个对两边都成立的字面路径；
    2) 少一次请求就少一种「图标没加载出来」的失败。
  所以 logo 是内联 SVG 重画的，不是 site/assets/img/logo.png 那张 21KB 的 PNG
  —— 内联那张会让页面凭空胖 28KB，而它本身就是几个几何图形，SVG 更清晰、
  也顺便能跟着深浅色主题走。

  数据从 URL 进来（原生算好候选，这一页负责排序与呈现），动作从 URL 出去
  （跳 nova://shortcut/…，由原生拦下来落盘）。所以这一页自己能测：
  把下面的 <script> 抽出来在 Node 里跑，不碰 DOM 就能覆盖全部排序规则。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- 锁死网络：这一页只有本地资源和内联脚本，任何一次外部请求都说明我写错了。
     注意 default-src 'none' 不会拦住点击磁贴的跳转 —— 导航不受 CSP 管辖，
     拦的是 fetch/XHR/图片/字体这类子资源。 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
<title>新标签页</title>
<style>
/* 令牌与 App 的 res/values/colors.xml、桌面端 shell.css 的 :root 逐条对应。
   这一页是独立文档，取不到那些变量，只能照抄一遍 —— 抄漏了就是新标签页
   跟浏览器其它部分不在一个色系里。所以改色时一共要记得三处：
   shell.css、res/values(+values-night)、以及这里。 */
:root {
    --bg: #F4F6FB;
    --surface: #FFFFFF;
    --surface-2: #EEF1F8;
    --border: #E4E8F2;
    --text: #101322;
    --text-3: #6A7288;
    --text-4: #9BA3B7;
    --brand: #2D6BF5;
    --accent: #00C8A8;
    --nova-grad: linear-gradient(135deg, #00C8A8, #2D6BF5);
    --danger: #FF4D4F;
    --shadow-sm: 0 1px 2px rgba(16, 19, 34, .06);
    --shadow-lg: 0 18px 44px rgba(16, 19, 34, .18);
}
html[data-theme="dark"] {
    --bg: #0A0D16;
    --surface: #131826;
    --surface-2: #1A2032;
    --border: #232A40;
    --text: #F2F5FC;
    --text-3: #939CB4;
    --text-4: #6C7590;
    --brand: #5B8BFF;
    --accent: #2BD9BE;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-lg: 0 18px 44px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 400 14px/1.5 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    /* 竖向居中：官网那张宣传图里内容贴着地址栏，那是因为 mockup 的屏幕矮。
       真机上这一块只占屏幕上半截，顶端对齐会显得下半屏是空的。 */
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
}
/* 窄屏且内容高时（横屏、分屏）改成顶端对齐，免得被裁掉 */
@media (max-height: 460px) {
    body { align-items: flex-start; padding: 18px 0; }
}

/* 三段按 DOM 顺序纵排，就是用户指定的版式：**上 logo、中搜索、下宫格**。
   纵向居中不归这里管 —— body 是 flex + align-items:center（矮屏下那条媒体查询
   会切成顶对齐并允许滚动）。所以这一格只管宽度与内边距，
   别在这里再写一遍居中：加了也不生效（.ntp 高度由内容决定），
   但注释会让人以为生效了。 */
.ntp { width: 100%; max-width: 420px; padding: 0 20px; }

/* ---------------------------------------------------------------- 搜索框 */
/* 位置在 logo 与宫格之间。宽度跟着 .ntp 走（最大 420px），
   桌面端由此得到一个和地址栏同量级的输入宽度 —— 它本来就是同一件事的
   两个入口，样子差太远会让人以为是两种功能。 */
.search {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;                 /* 与磁贴同高，三段之间的节奏一致 */
    padding: 0 6px 0 12px;
    margin: 0 0 26px;
    border-radius: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color .15s, box-shadow .15s;
}

.search:focus-within {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(45, 107, 245, .16);
}

.s-ico {
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    color: var(--text-3);
}

.s-ico svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
}

.search input {
    flex: 1 1 auto;
    min-width: 0;                 /* 不加这条：flex 子项在窄屏上不会收缩 */
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
}

.search input::placeholder { color: var(--text-4); }

.s-go {
    flex: 0 0 auto;
    height: 32px;
    padding: 0 14px;
    border: 0;
    border-radius: 22px;
    background: var(--brand);
    color: #fff;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
}

.s-go:active { opacity: .85; }

/* ---------------------------------------------------------------- 品牌区 */
/* 尺寸不是照抄官网宣传图的像素值。
   那张 mockup 的手机只有 262px 宽（屏内 244px），它是一个**缩略示意**，
   里面的 40px 磁贴、9px 标签是缩略图上的数字，不是真机规格 ——
   照搬过去就是 40dp 的磁贴，比项目自己在 README 里为底栏并格论证过的
   44px 触控下限还小。所以这里按真机重定：磁贴 56dp（稳稳高过 44dp 下限，
   也与主流浏览器的九宫格同量级），标签 11sp。 */
.brand { text-align: center; padding: 0 0 26px; }
/* logo 放大到 88px：它是这三段里最大的那一个（下面依次是搜索框 44px、
   磁贴 56px），这样三段的主次一眼分得出来。
   88 与 56 的比例也更像「品牌标识 : 入口磁贴」而不是两个同级图标。 */
.brand svg {
    display: block;
    width: 88px; height: 88px;
    margin: 0 auto 14px;
    border-radius: 22px;
    box-shadow: var(--shadow-sm);
}
.brand p { margin: 0; color: var(--text-3); font-size: 13px; }

/* ------------------------------------------------------------ 快捷方式 */
.quicks {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px 4px;
    padding: 8px 0 16px;
}
.qk {
    text-align: center;
    cursor: pointer;
    user-select: none;
    /* 磁贴是 <a href>，不关掉的话每一格底下都拖一条下划线，
       而这里既有一格「＋添加」（它没有 href，所以没有下划线）——
       两行磁贴一条有线一条没有，看着像是渲染坏了。 */
    text-decoration: none;
    color: inherit;
    /* 固定一格的大小：磁贴 56dp、标签一行，两者都不许被内容顶大。
       grid 项默认 min-width:auto / min-height:auto，长名字或长域名都会把格子撑变形，
       4 列网格随之歪掉 —— 所以两个 min 值都要放开，尺寸只由 CSS 决定。 */
    min-width: 0;
    min-height: 0;
    /* 内容再长也不换行、不撑格：超出的部分由 .qk span 的省略号收掉。 */
    overflow: hidden;
}
/* 磁贴外面再包一层定尺寸的壳，删除角标才能贴着磁贴的右上角定位 ——
   直接挂在这一格上的话，它是按整格（含标签）定位的，角标会飘到格的右上角去。 */
.qk .thumb {
    position: relative;
    display: block;
    width: 56px; height: 56px;
    margin: 0 auto 7px;
}
.qk .thumb i {
    display: grid;
    place-items: center;
    width: 100%; height: 100%;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-style: normal;
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    box-shadow: var(--shadow-sm);
    transition: transform .12s ease;
}
.qk:active .thumb i { transform: scale(.92); }
/* 有站点图标的那一格：磁贴自己不再画底色和描边，图标直接落在页面底色上。
   图标是站点自己画的，尺寸千差万别（16px 的 ico 与 180px 的 touch icon 都有），
   统一按 60% 居中缩放 —— 60% 正是设计板上「30dp 图标落在 56dp 磁贴里」的比例。
   差一两个像素没人看得出，但八格里「七格大小不一」是看得出来的。 */
.qk .thumb i.ico {
    background: none;
    border: 0;
    box-shadow: none;
}
.qk .thumb i.ico img {
    width: 60%;
    height: 60%;
    object-fit: contain;
}
.qk span {
    display: block;
    /* 必须限宽，否则省略号不生效。
       .qk 是 grid 项，默认 min-width:auto —— 内容的固有宽度会把它撑开，
       于是「一个名字很长的站点」那一格比旁边几格宽，4 列网格整个歪掉。
       限成 100%（一格的宽）再配 ellipsis，名字再长也只在这一格内截断。 */
    max-width: 100%;
    color: var(--text-3);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    /* grid 项的 min-width 也要放开：上面 max-width 限的是内容宽度，
       这一条限的是盒子本身不被内容顶开，两者缺一不可。 */
    min-width: 0;
}
/* 「＋添加」那一格：不加渐变底色，靠描边和灰字跟真磁贴区分 */
.qk.add .thumb i {
    background: var(--surface-2);
    color: var(--text-4);
    font-weight: 500;
    font-size: 24px;
}

/* 编辑态：每个磁贴右上角一个删除角标 */
.qk .del {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 20px; height: 20px;
    display: none;
    place-items: center;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    box-shadow: var(--shadow-sm);
}
body.editing .qk .del { display: grid; }
body.editing .qk:active .thumb i { transform: none; }

.hint {
    margin: 2px 0 0;
    text-align: center;
    color: var(--text-4);
    font-size: 11px;
    min-height: 17px;
}

/* ================================================ 宽屏：跟着窗口自适应
 * 手机版式是一条 420px 的竖列、宫格钉死 4 列 —— 那在手机上是刚好，
 * 搬到 PC 上就成了中间一条窄栏、两边各空一大片，看着像把手机界面贴在了
 * 窗口正中。所以宽屏下整块跟着窗口放宽：
 *   · 容器宽度按窗口走（上限 1040px，再宽就只是两边留白多一点）；
 *   · 宫格列数交给 auto-fill 自己算 —— 磁贴仍是 56px（手指点得到的尺寸，
 *     放大没有意义），窗口越宽一行排得越多，排完就收，不写死列数；
 *   · 搜索框限 560px 居中：让它跟着容器拉到上千像素宽的话，输入框会比
 *     地址栏长出一大截，而这两处本是同一件事的两个入口。
 * 窗口拖窄到 700px 以下自动落回手机版式，拖宽再回来，不用改任何参数。
 * 断点取 700 而不是 1024：PC 上一个分屏/半屏窗口常年在 700～900 之间，
 * 按 1024 断的话那种尺寸反而落在最不该落的那档。 */
@media (min-width: 700px) {
    .ntp { max-width: min(1040px, 90vw); padding: 0 32px; }
    .brand svg { width: 104px; height: 104px; margin-bottom: 18px; }
    .search { max-width: 560px; margin: 0 auto 26px; height: 46px; }
    .quicks {
        grid-template-columns: repeat(auto-fill, 96px);
        justify-content: center;
        gap: 22px 12px;
        padding: 14px 0 20px;
    }
    .qk span { font-size: 12px; }
    .hint { font-size: 12px; }
}
/* 只有真有指针的设备才给 hover 反馈 —— 触屏上 hover 会「粘住」，
   点完一格它还亮着，看着像被选中了。磁贴抬一点、商店入口变个色，
   桌面上一眼能看出这些格子是可以点的。 */
@media (min-width: 700px) and (hover: hover) {
    .qk .thumb i { transition: transform .12s ease, box-shadow .12s ease; }
    .qk:hover .thumb i { box-shadow: 0 4px 12px rgba(16, 23, 40, .18); }
    .store-link:hover { color: var(--brand); border-color: var(--brand); }
}

/* ----------------------------------------------------- 插件商店入口 */
/* 仅 PC 端新标签页出现（共享页面靠主机多挂的 store=1 开关显隐）。它不进 7 宫格，
   以免挤掉「＋添加」那一格；用一条独立的点状按钮带出去，保持宫格纯净。
   移动端不挂 store=1，这个入口永远不显示 —— 满足「PC 新标签页加插件商店链接」。 */
.store-link {
    display: none;
    margin: 16px auto 0;
    padding: 9px 18px;
    width: fit-content;
    border: 1px dashed var(--border);
    border-radius: 999px;
    color: var(--text-3);
    font-size: 12.5px;
    text-decoration: none;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, color .12s ease, border-color .12s ease;
}
.store-link.on { display: inline-block; }
.store-link:active { transform: scale(.97); color: var(--brand); border-color: var(--brand); }

/* -------------------------------------------------------------- 添加表单 */
.scrim {
    position: fixed;
    inset: 0;
    background: rgba(16, 23, 40, .42);
    display: none;
}
.scrim.on { display: block; }

.sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 100%;
    max-width: 420px;
    padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    box-shadow: var(--shadow-lg);
    display: none;
}
.sheet.on { display: block; }
.sheet h2 {
    margin: 0 0 12px;
    font-size: 16px;
    font-weight: 600;
}
.sheet label {
    display: block;
    margin-bottom: 10px;
    color: var(--text-3);
    font-size: 12px;
}
.sheet input {
    display: block;
    width: 100%;
    margin-top: 5px;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-size: 15px;
}
.sheet input:focus {
    outline: none;
    border-color: var(--brand);
    background: var(--surface);
}
.sheet .row { display: flex; gap: 10px; margin-top: 14px; }
.sheet button {
    flex: 1;
    padding: 12px 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    cursor: pointer;
}
.sheet button.pri {
    border-color: transparent;
    background: var(--brand);
    color: #fff;
    font-weight: 600;
}
</style>
</head>
<body>

<main class="ntp">
    <div class="brand">
        <!-- 照 site/assets/img/logo.png 重画：蓝入青绿出的圆角方块 + 白色四角星 + 倾斜环与小卫星。
             渐变角度与色标跟官网 --grad-brand 一致（135deg，#5B84FF → #3D6BFF → #00B8A2）。

             这一块是整页的主视觉，下面依次是搜索框与宫格。
             曾经一度把搜索框从这一页移走过（理由写的是「地址栏已经是入口」），
             但用户明确要求的版式就是「上 logo、中搜索、下宫格」——
             新标签页是从零开始的那一屏，视线落在中央而不是先去点地址栏。 -->
        <svg viewBox="0 0 52 52" aria-hidden="true">
            <defs>
                <linearGradient id="novaLogo" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#00C8A8" />
                    <stop offset="0.5" stop-color="#1699CE" />
                    <stop offset="1" stop-color="#2D6BF5" />
                </linearGradient>
            </defs>
            <rect width="52" height="52" rx="13" fill="url(#novaLogo)" />
            <ellipse cx="26" cy="27" rx="17" ry="6.4" transform="rotate(-20 26 27)"
                     fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5" />
            <path d="M26 10.5 Q26 26 40 26 Q26 26 26 41.5 Q26 26 12 26 Q26 26 26 10.5 Z"
                  fill="#FFFFFF" />
            <circle cx="39.4" cy="20.6" r="2.5" fill="#FFFFFF" />
        </svg>
        <p>吾爱Nova · 新标签页</p>
    </div>

    <!-- 搜索框：**在 logo 与宫格之间**（这一页的纵向顺序就是
         上 logo、中搜索、下宫格，用户明确指定的，不要动）。

         为什么把搜索放回这一页：曾经把它移走过（理由写的是「地址栏已经是
         搜索入口，再摆一个只是重复」）。但新标签页是「从零开始」的那一屏 ——
         用户第一次打开浏览器时，视线落在页面中央，而不是先去点地址栏。
         中央留白什么都不给，等于逼他先学会用地址栏。

         它是本地文件、没有 preload，所以自己不能导航：提交时把关键词交给
         宿主（nova://shortcut/search?q=…），由宿主按当前搜索引擎打开。 -->
    <form class="search" id="search" role="search" autocomplete="off">
        <span class="s-ico" aria-hidden="true">
            <svg viewBox="0 0 20 20">
                <circle cx="9" cy="9" r="5.2" />
                <path d="M12.9 12.9L16.5 16.5" />
            </svg>
        </span>
        <input id="q" type="text" name="q" spellcheck="false"
               placeholder="搜索或输入网址" aria-label="搜索或输入网址" />
        <button type="submit" class="s-go">搜索</button>
    </form>

    <nav class="quicks" id="quicks" aria-label="快捷方式"></nav>
    <p class="hint" id="hint">长按图标可删除</p>
    <a class="store-link" id="store-link" role="button" aria-label="插件商店" hidden>⚙ 插件商店</a>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="添加快捷方式">
    <h2>添加快捷方式</h2>
    <label>名称
        <input id="f-label" type="text" maxlength="12" placeholder="例如：知乎" />
    </label>
    <label>网址
        <input id="f-url" type="text" inputmode="url" autocomplete="off" placeholder="例如：zhihu.com" />
    </label>
    <div class="row">
        <button type="button" id="f-cancel">取消</button>
        <button type="button" class="pri" id="f-save">保存</button>
    </div>
</div>

<script>
/* ============================================================================
   下面是这一页的全部逻辑。前半段是纯函数（不碰 DOM），末尾才挂事件。
   纯函数那段会被 tools/test-newtab.js 抽出来在 Node 里直接跑 —— 排序规则
   是最容易改错又最难肉眼发现的部分（少一个图标、顺序不对），必须有测试钉住。
   ========================================================================== */
var NovaNtp = (function () {
    'use strict';

    /** 快捷方式上限。**刻意是 7 而不是 8**：第 8 格永远留给「＋添加」，
        两行四列正好填满。设成 8 的话 8 个磁贴加「＋」共 9 格，第三行只落一个，
        看着像坏了。 */
    /* 版面容量：内置那七条占满之后，至少还得留一格给用户自己加的 ——
       内置涨到七条时这一位不放开的话，用户点「＋添加」加进来的站点会被
       整条截掉（截断发生在最后，而内置是先占位的）。8 = 7 内置 + 1 自加，
       再后面那格是「＋添加」，它不占这个数。 */
    var MAX_SHORTCUTS = 8;

    var SCHEME = 'nova://shortcut/';

    /** 候选行的字段分隔符。用制表符而不是 JSON：
        两端都要在没有 JSON 库的前提下拼这段文本（安卓侧不引 org.json，
        本地单测里 org.json 是空壳会抛 Stub!），逐行拆字段最省事。 */
    var SEP = '\t';

    /** 从 URL 取 host；取不到就原样返回。与 Tab.hostOf 的分支保持一致：
        没有 authority 段的（about:blank、data:、file://）原样返回，
        硬套「去端口」会把 about:blank 砍成 about。 */
    function hostOf(url) {
        if (!url) return '';
        var i = url.indexOf('://');
        if (i < 0) return url;
        var s = url.slice(i + 3);
        var end = s.length;
        for (var k = 0; k < s.length; k++) {
            var c = s.charAt(k);
            if (c === '/' || c === '?' || c === '#') { end = k; break; }
        }
        var host = s.slice(0, end);
        var at = host.lastIndexOf('@');
        if (at >= 0) host = host.slice(at + 1);
        var colon = host.lastIndexOf(':');
        if (colon > 0 && host.indexOf(']') < colon) host = host.slice(0, colon);
        return host;
    }

    /** 磁贴底色。按 host 哈希从官网那套调色板里取，同一个站点每次进来颜色都一样
        —— 会变色的图标等于没有识别价值。 */
    var GRADS = [
        ['#3D6BFF', '#5B84FF'],
        ['#00B8A2', '#34D399'],
        ['#2E56D9', '#3D6BFF'],
        ['#00937F', '#00B8A2'],
        ['#3D6BFF', '#00B8A2'],
        ['#34D399', '#22C55E'],
        ['#5B84FF', '#00B8A2']
    ];

    function hash(s) {
        var h = 0;
        for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1000003;
        return h;
    }

    function gradOf(url) {
        var g = GRADS[hash(hostOf(url) || url) % GRADS.length];
        return 'linear-gradient(135deg,' + g[0] + ',' + g[1] + ')';
    }

    /** 磁贴上的那个字。
        中文取第一个字（「知乎」→ 知）；英文域名取首字母大写（github.com → G）。
        先看名称再看域名 —— 用户自己起的名字比域名更认得出。 */
    function initialOf(label, url) {
        var s = (label || '').trim();
        if (!s) s = hostOf(url).replace(/^www\./, '');
        if (!s) return '·';
        var c = s.charAt(0);
        if (/[a-z]/.test(c)) return c.toUpperCase();
        if (/[A-Z0-9]/.test(c)) return c;
        // 汉字、假名等：直接用它自己，取前一个字符就够
        return c;
    }

    /** 把域名压短当默认名称：www.zhihu.com → zhihu.com */
    function shortName(url) {
        return hostOf(url).replace(/^www\./, '') || url;
    }

    /**
     * 这个站点有没有现成的图标，有就返回一个 data: URI。
     *
     * 图标表由宿主喂进来（window.__novaIcons，形如 {"www.zhihu.com": "data:image/png;base64,…"}）——
     * 这一页的 CSP 是 `default-src 'none'; img-src data:`，等于把网络整个锁死，
     * 页面自己一个请求都发不出去。这是刻意的：一张本地页面没有任何理由联网。
     * 于是「自动获取站点图标」这件事由原生抓、原生缓存，再以 data: 交进来
     * （安卓侧见 FaviconCache.java，桌面侧见 src/main/favicon-cache.js ——
     * 两份实现语义逐条对齐，TTL、探测顺序、文件名清洗规则都同值）。
     * 两端的宿主都会在页面加载完成后注入这张表（安卓 MainActivity#injectFavicons、
     * 桌面 main.js#injectFavicons），表是空的也照样注入，免得页面停在上一张旧表上。
     *
     * 查表要试三个键：原文主机名、去掉 www. 的、以及补上 www. 的。
     * 因为「哪一边带 www.」是站点的自由，而发请求的是宿主、渲染的是页面，
     * 两边对同一个站点的写法不保证一模一样。
     *
     * 取不到返回空串（不是 null）：调用方只判真假，两种写法都能用，
     * 而空串在拼 CSS / 判空时更不容易漏。
     */
    function iconOf(url) {
        var map = (typeof window !== 'undefined') ? window.__novaIcons : null;
        if (!map) return '';
        var h = hostOf(url);
        if (!h) return '';
        var bare = h.replace(/^www\./, '');
        var hit = map[h] || map[bare] || map['www.' + bare];
        return typeof hit === 'string' ? hit : '';
    }

    /**
     * 解析原生传来的候选文本。每行 `label<TAB>url<TAB>visits<TAB>flags`。
     * 坏行直接跳过：这一页是拿来用的，不是拿来校验上游的。
     *
     * flags 三种取值，可以叠加（现在只会单独出现）：
     *   p —— 用户自己加的，排在最前，不参与次数排序
     *   f —— 官方推荐位，宿主在候选不够填满版面时补在末尾的（见 ntp.js 的
     *        BUILTIN_SITES）。它和普通候选一样能点、能删，只是排序时垫底
     *   - —— 普通候选（历史里的常去站点）
     */
    function parseData(text) {
        var out = [];
        if (!text) return out;
        var lines = String(text).split('\n');
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            if (!line) continue;
            var f = line.split(SEP);
            var url = (f[1] || '').trim();
            if (!url) continue;
            var flags = f[3] || '';
            out.push({
                label: (f[0] || '').trim() || shortName(url),
                url: url,
                visits: parseInt(f[2], 10) || 0,
                pinned: flags.indexOf('p') >= 0,
                builtin: flags.indexOf('f') >= 0
            });
        }
        return out;
    }

    /**
     * 排序：**内置推荐位先占位**，用户自己加的填剩下的格子，
     * 同 host 只留第一个，最后截到上限。
     *
     * 只有两档了：builtin（内置那七条，flags 里的 f）与 pinned（用户自己加的）。
     * 排在最前的 builtin 因此是**固定**的 —— 刷新页面、自己加了多少条，
     * 都不会让它们挪位或消失。
     * 「固定」是这个产品的承诺之一，放在后面就废了（截断会把它们整条截掉）。
     *
     * 「同 host 去重」而不是「同 url 去重」：用户可能收藏了 zhihu.com 上
     * 好几条不同的专栏/问题页，按 url 去重的话这几个格子会被同一家占满 ——
     * 那就不叫快捷方式了。
     */
    function rank(cands, max) {
        var cap = (max === undefined || max === null) ? MAX_SHORTCUTS : max;
        var seen = {};
        var pinned = [];
        var builtin = [];
        for (var i = 0; i < (cands || []).length; i++) {
            var c = cands[i];
            if (!c || !c.url) continue;
            var h = hostOf(c.url);
            if (seen[h]) continue;
            seen[h] = 1;
            if (c.pinned) pinned.push(c);
            else if (c.builtin) builtin.push(c);
            /* 其余的一律丢掉。
               曾经这里还有第三档 rest（按访问次数排序的浏览历史），2026-10 起
               新标签页**不再显示浏览历史** —— 那一屏的用途是「挑个地方开始
               浏览」而不是「回顾去过的地方」，而历史每次都在变，混进来会让
               这一屏长得不一样，固定入口也就没了。
               留着这一档只会让人以为还有第三档；真要恢复浏览历史，
               该改的是宿主侧的候选来源，而不是这里。 */
        }
        /* 内置推荐位（flags 里的 f）**先占位**，用户自己加的填剩下的格子。
           刻意放在 pinned 前面而不是后面：截断（slice）发生在最后，
           垫底的话候选一多，这七条就被整条截掉 —— 而「固定」的意思正是
           它们不该随用户加了多少条而增减。取用时从这七条里往后挑，
           挑到把版面填满为止，多的那几条本轮不显示、下一轮还在原地。 */
        var slots = builtin.concat(pinned);
        return slots.slice(0, cap);
    }

    /** 候选为空时的兜底：官网宣传图里那七个，顺序也一样。
        收不到原生数据时（同步出错、注入失败）也得有一屏能看的东西，不能白屏。
        与 ntp.js 的 BUILTIN_SITES 是同一份数据 —— 那边是宿主在候选不够时
        补到版面末尾用的（flags 为 f），这里是页面在一条数据都没收到时的
        最后一道兜底（flags 为 p，直接占前排）。两份由 tools/test-newtab.js
        逐条比对，改一份漏一份会被拦下。
        注意两边 flags 不同不代表数据不同：那一位说的是「这批项该怎么排序」，
        不是「这是哪几条站点」。 */
    var FALLBACK = '主页\thttps://www.52ta.top/\t0\tp\n'
        + '导航\thttps://52ta.top/\t0\tp\n'
        + '播放器\thttps://music.52ta.top/\t0\tp\n'
        + '浏览器\thttps://nova.52ta.top/\t0\tp\n'
        + '百度\thttps://www.baidu.com/\t0\tp\n'
        + 'DeepSeek\thttps://chat.deepseek.com/\t0\tp\n'
        + '吾爱装机助手\thttps://assistant.52ta.top/\t0\tp';

    /** 拼一条回传原生的命令。参数一律 encodeURIComponent，
        否则名称里的空格和中文会把命令拆坏。 */
    function cmdUrl(op, params) {
        var qs = [];
        for (var k in params) {
            if (!Object.prototype.hasOwnProperty.call(params, k)) continue;
            if (params[k] === null || params[k] === undefined) continue;
            qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(String(params[k])));
        }
        return SCHEME + encodeURIComponent(op) + (qs.length ? '?' + qs.join('&') : '');
    }

    /** 用户敲进来的东西 → 一个正经 URL。
        没写协议就补 https://；看着像域名才认，不像就退回去让调用方拦下。 */
    function normalizeUrl(input) {
        var s = (input || '').trim();
        if (!s) return '';
        if (/^https?:\/\//i.test(s)) return s;
        if (/^[^\s/]+\.[^\s/]{2,}/.test(s)) return 'https://' + s;
        return '';
    }

    return {
        MAX_SHORTCUTS: MAX_SHORTCUTS,
        FALLBACK: FALLBACK,
        hostOf: hostOf,
        gradOf: gradOf,
        initialOf: initialOf,
        iconOf: iconOf,
        shortName: shortName,
        parseData: parseData,
        rank: rank,
        cmdUrl: cmdUrl,
        normalizeUrl: normalizeUrl
    };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = NovaNtp;
</script>

<script>
/* ---------------------------------------------------------------------------
   挂载：读 URL 上的参数 → 渲染。这一段碰 DOM，所以单独一个 <script>，
   上面的纯函数脚本块（以及测试抽取的那一块）不需要它。
   ------------------------------------------------------------------------- */
(function () {
    'use strict';

    function param(name) {
        var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search + location.hash);
        if (!m) return null;
        // 把 `+` 当空格。这是 Java 与 JS 之间一个很安静的坑：安卓侧拼 URL 用的是
        // java.net.URLEncoder，它按表单规则把空格编成 `+`；而这里读的是
        // decodeURIComponent，它只认 %20，不认 `+` —— 于是名称里带空格的
        // 快捷方式到了页面上会变成「My+Site」。两端都做了处理，谁改都还有一层兜住。
        try { return decodeURIComponent(m[1].replace(/\+/g, '%20')); } catch (e) { return null; }
    }

    // 主题：原生显式传 theme 优先，没传就看系统。传而不是让 CSS 自己判断，
    // 是因为移动端的 WebView 不一定把系统深浅色透给页面。
    var theme = param('theme');
    if (theme !== 'dark' && theme !== 'light') {
        theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);

    var raw = param('data');
    var cands = NovaNtp.parseData(raw ? raw : NovaNtp.FALLBACK);
    var list = NovaNtp.rank(cands, NovaNtp.MAX_SHORTCUTS);
    // 兜底也可能被用户删空（数据里一个有效的都没有），那就退回内置那七个
    if (!list.length) list = NovaNtp.rank(NovaNtp.parseData(NovaNtp.FALLBACK), NovaNtp.MAX_SHORTCUTS);

    var quicks = document.getElementById('quicks');

    function tile(item) {
        var a = document.createElement('a');
        a.className = 'qk';
        a.href = item.url;
        a.title = item.label;
        // 删除角标与磁贴同处一层壳里，它按壳定位，才贴得住磁贴的右上角
        var thumb = document.createElement('span');
        thumb.className = 'thumb';
        var i = document.createElement('i');
        // 有站点图标就用图标，没有才回落成「渐变底 + 首字」。
        // 这不是两种样式，而是同一格的两条路：图标是站点自己画的（最认得出），
        // 渐变底 + 首字是这一页自己造的识别符号（兜底，深浅色下都成立）。
        // 所以「取不到图标」不是一个需要单独设计的空状态 —— 它就是默认那一版。
        var ico = NovaNtp.iconOf(item.url);
        if (ico) {
            i.className = 'ico';
            var img = document.createElement('img');
            img.src = ico;
            img.alt = '';
            // 图标是本地缓存的字节，仍可能解不出来（站点传了个坏的 / 我们的
            // 字节头判定放过了什么）。解不出来的话退回渐变底 + 首字 ——
            // 留一个空白格子，用户会以为这格坏了。
            img.onerror = function () {
                i.className = '';
                i.style.background = NovaNtp.gradOf(item.url);
                i.textContent = NovaNtp.initialOf(item.label, item.url);
            };
            i.appendChild(img);
        } else {
            i.style.background = NovaNtp.gradOf(item.url);
            i.textContent = NovaNtp.initialOf(item.label, item.url);
        }
        /* 删除角标只给**用户自己加的**那些。
         *
         * 内置那七条是这一页的**版式本身**（用户指定的固定入口），
         * 不该被删掉 —— 删掉之后版面就变了，而「顺序不能变」正是要求之一。
         * 之前给它们也挂了角标，删一个还会让其余的往前补位，一屏网址变样两次。 */
        if (!item.builtin) {
            var del = document.createElement('b');
            del.className = 'del';
            del.textContent = '×';
            thumb.appendChild(del);
        }
        thumb.appendChild(i);

        var s = document.createElement('span');
        s.textContent = item.label;
        a.appendChild(thumb);
        a.appendChild(s);

        // 编辑态下点磁贴 = 删除，而不是跳转；角标只是把这条规则画出来
        a.addEventListener('click', function (ev) {
            if (!document.body.classList.contains('editing')) return;
            // 内置那七条在编辑态下也不删（它们是版式，不是用户加的收藏）
            if (item.builtin) return;
            ev.preventDefault();
            location.href = NovaNtp.cmdUrl('remove', { url: item.url });
        });
        // 长按进编辑态。桌面端没有长按（鼠标按住不算），所以另给一条：
        // 右键也能进，免得 PC 用户永远发现不了删除。
        var timer = null;
        var start = function () { timer = setTimeout(edit, 500); };
        var stop = function () { if (timer) { clearTimeout(timer); timer = null; } };
        a.addEventListener('touchstart', start, { passive: true });
        a.addEventListener('touchmove', stop, { passive: true });
        a.addEventListener('touchend', stop);
        a.addEventListener('touchcancel', stop);
        a.addEventListener('contextmenu', function (ev) { ev.preventDefault(); edit(); });
        return a;
    }

    function addTile() {
        var a = document.createElement('a');
        a.className = 'qk add';
        // 刻意不给 href（也不给 javascript:void 0）：带 href 的话点一下会改掉
        // location，而这一页的入参是从 location.search + location.hash 读的，
        // 自己往地址上加东西迟早会踩到自己的解析。
        a.setAttribute('role', 'button');
        a.setAttribute('tabindex', '0');
        var thumb = document.createElement('span');
        thumb.className = 'thumb';
        var i = document.createElement('i');
        i.textContent = '＋';
        thumb.appendChild(i);
        var s = document.createElement('span');
        s.textContent = '添加';
        a.appendChild(thumb);
        a.appendChild(s);
        a.addEventListener('click', function (ev) { ev.preventDefault(); open(); });
        return a;
    }

    function paint() {
        quicks.textContent = '';
        for (var i = 0; i < list.length; i++) quicks.appendChild(tile(list[i]));
        quicks.appendChild(addTile());
    }

    function edit() {
        document.body.classList.add('editing');
        document.getElementById('hint').textContent = '点击图标右上角的 × 删除';
    }
    function unedit() {
        document.body.classList.remove('editing');
        document.getElementById('hint').textContent = '长按图标可删除';
    }

    var sheet = document.getElementById('sheet');
    var scrim = document.getElementById('scrim');
    function open() {
        unedit();
        document.getElementById('f-label').value = '';
        document.getElementById('f-url').value = '';
        sheet.classList.add('on');
        scrim.classList.add('on');
        document.getElementById('f-url').focus();
    }
    function close() { sheet.classList.remove('on'); scrim.classList.remove('on'); }

    document.getElementById('f-cancel').addEventListener('click', close);
    scrim.addEventListener('click', function () { close(); unedit(); });
    document.getElementById('f-save').addEventListener('click', function () {
        var url = NovaNtp.normalizeUrl(document.getElementById('f-url').value);
        if (!url) {
            document.getElementById('f-url').focus();
            return;
        }
        var label = document.getElementById('f-label').value.trim() || NovaNtp.shortName(url);
        location.href = NovaNtp.cmdUrl('add', { label: label, url: url });
    });
    // 回车即保存：这个表单只有两栏，再让用户去点按钮是多余的
    document.getElementById('f-url').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') document.getElementById('f-save').click();
    });
    // 原来这里接着是主页搜索框的 submit 接线（回传 nova://shortcut/search）。
    // 搜索框已随 logo 主视觉一起移除，接线一并删掉 ——
    // 留着它会在加载时对 null 调 addEventListener，直接抛错、后面全不执行。
    // 搜索的入口就是浏览器自己的地址栏，不必在「挑去哪」的这一页再摆一个。
    document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') { if (sheet.classList.contains('on')) close(); else unedit(); }
    });

    /* 搜索框：把关键词交给宿主去开。
     *
     * 这一页是本地文件、没有 preload，自己不能导航 —— 也就是不能简单地
     * `location.href = 'https://baidu.com/s?wd=…'`（那样会把新标签页这一页
     * 自己顶掉，而它是要留着给下一个标签页用的）。所以走同一条 nova:// 命令，
     * 由宿主按**当前设置的搜索引擎**打开结果页。
     *
     * 为什么用 form + submit 而不是只监听按钮点击：手机上虚拟键盘的回车键
     * 触发的是 submit，不是按钮的 click —— 只听 click 的话，手机上按回车
     * 什么都不发生。所以两件事都要做：拦住默认提交（否则本地文件会被当成
     * 表单目标去导航），再自己发命令。 */
    (function () {
        var form = document.getElementById('search');
        var input = document.getElementById('q');
        if (!form || !input) return;
        form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var q = (input.value || '').trim();
            if (!q) { input.focus(); return; }
            location.href = NovaNtp.cmdUrl('search', { q: q });
        });
    })();

    // 插件商店入口：仅当 PC 主机多挂的 store=1 参数在时才出现。点一下跳
    // nova://shortcut/extstore，由原生拦截后打开扩展面板（含商店）。
    (function () {
        var sl = document.getElementById('store-link');
        if (!sl || param('store') !== '1') return;
        sl.hidden = false;
        sl.classList.add('on');
        sl.addEventListener('click', function (ev) {
            ev.preventDefault();
            location.href = NovaNtp.cmdUrl('extstore', {});
        });
    })();

    paint();

    /**
     * 宿主把图标表喂进来之后，叫这一页重画一遍。
     *
     * 表是异步到的：图标由原生在后台抓（缓存过期才抓，见 FaviconCache），
     * 而这一页在 onPageFinished 时就已经画好了 —— 抓得比加载慢，所以必须留一个
     * 「再画一次」的入口。不进这里的话，第一次进新标签页永远看不到图标
     * （要等下一次打开才碰上缓存），用户会以为这个功能没生效。
     *
     * 重建放在下一帧，而不是同步做：宿主是在 onPageFinished 里注入的，
     * 那时页面可能还有几帧没画完，同步把八格拆了重建，用户会看到一次闪动。
     * 反正磁贴重建本来就要等一次样式计算，等一帧再动不会更慢。
     *
     * 直接复用 paint()：重建磁贴本来就是它在做的事。另写一段「只换图标」的
     * 增量逻辑，等于把「一格磁贴长什么样」这件事写成两份，改一处必漏一处。
     */
    window.__novaApplyIcons = function () {
        (window.requestAnimationFrame || function (fn) { setTimeout(fn, 16); })(function () {
            paint();
        });
    };
})();
</script>
</body>
</html>
