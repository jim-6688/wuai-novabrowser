<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-layout="desktop">
<head>
  <meta charset="utf-8" />
  <!-- 嗅探面板里要能直接试听 / 试看外链媒体，所以 media-src 必须放开外域；
       不放宽的话 <video preload="metadata"> 会被 CSP 直接拦掉，连时长都读不到 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https: http: blob:; script-src 'self'" />
  <title>吾爱Nova浏览器 · 多内核</title>
  <link rel="icon" href="../../assets/icon/nova-icon-32.png" />
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
<div class="app">

  <!-- ============ 标题栏（桌面端） ============ -->
  <header class="titlebar">
    <!-- 左上角品牌区同时是**设置入口**（点一下开设置）。
         标题栏整条是窗口拖拽区，所以这一格要单独标 no-drag（见 CSS）。
         用 div + role="button" 而不是 <button>：这一格内部是 flex 徽标排版，
         换成 button 要先把浏览器给按钮的一整套默认样式压回去，
         而它本来就不在表单里、不需要 submit 语义。键盘可达性靠 tabindex
         + Enter/Space 的 keydown 补上。 -->
    <div class="tb-brand" id="btn-brand" role="button" tabindex="0"
         title="设置（也可以点右侧的菜单按钮）">
      <!-- 标头用的不是完整图标，而是扒掉了底色的「星芒 + 轨道环」标识本身 ——
           这一格已经有品牌渐变底，再叠一层图标自己的圆角方底就是两层底叠着。
           另外环的描边从 1.6 加粗到 4、星芒外径从 17 放到 19：13px 下按原参数
           渲染，环只有 0.3px，直接消失。 -->
      <span class="brand-mark">
        <svg viewBox="0 0 64 64" width="13" height="13" aria-hidden="true">
          <g transform="rotate(-24 32 32)">
            <ellipse cx="32" cy="32" rx="20" ry="8.4" fill="none" stroke="#fff" stroke-opacity="0.62" stroke-width="4" />
          </g>
          <path d="M32 13 Q35 29 51 32 Q35 35 32 51 Q29 35 13 32 Q29 29 32 13 Z" fill="#fff" />
        </svg>
      </span>
      <span class="brand-name">吾爱Nova</span>
      <span class="brand-tag" id="brand-tag">多内核</span>
    </div>

    <!-- 品牌名右边的快捷开关。这一格过去是死空白（弹性拖拽区把余量全吃了），
         放两个「要开一眼才知道状态、改起来却得进设置点三层」的开关：主题与
         收藏夹栏。标题栏整条是窗口拖拽区，所以这组按钮要单独标 no-drag。 -->
    <div class="tb-quick">
      <button class="qk-btn" id="qk-theme" title="主题">
        <svg class="qk-sun" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="3.6" />
          <path d="M10 2.6v2M10 15.4v2M2.6 10h2M15.4 10h2M4.8 4.8l1.4 1.4M13.8 13.8l1.4 1.4M15.2 4.8l-1.4 1.4M6.2 13.8l-1.4 1.4" />
        </svg>
        <svg class="qk-moon" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M16.2 12.4A6.6 6.6 0 0 1 7.6 3.8a6.8 6.8 0 1 0 8.6 8.6z" />
        </svg>
        <span class="qk-label">主题</span>
      </button>
      <button class="qk-btn" id="qk-bmbar" title="收藏夹栏">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M6.2 3.5h7.6v8.6l-3.8-2.9-3.8 2.9z" />
          <path d="M3.4 16.5h13.2" />
        </svg>
        <span class="qk-label">收藏夹</span>
      </button>
      <button class="qk-btn" id="qk-about" title="关于吾爱Nova浏览器">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="7.2" />
          <path d="M10 8.9v4.4M10 6.3v.01" />
        </svg>
        <span class="qk-label">关于</span>
      </button>
    </div>
    <div class="tb-drag"></div>
    <div class="tb-win">
      <button class="winbtn" data-win="minimize" title="最小化">
        <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
      </button>
      <button class="winbtn" data-win="maximize" title="最大化">
        <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
      </button>
      <button class="winbtn winbtn-close" data-win="close" title="关闭">
        <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
      </button>
    </div>
  </header>

  <!-- ============ 标签条 ============ -->
  <div class="tabstrip">
    <div class="tabs" id="tabs"></div>
    <button class="tab-new" id="tab-new" title="新建标签页">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" /></svg>
    </button>
    <div class="tabstrip-fill"></div>
    <button class="tab-list-btn" id="tab-list-btn" title="标签页总览">
      <svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1" /><rect x="9" y="2" width="5" height="5" rx="1" /><rect x="2" y="9" width="5" height="5" rx="1" /><rect x="9" y="9" width="5" height="5" rx="1" /></svg>
    </button>
  </div>

  <!-- ============ 工具栏 ============ -->
  <div class="toolbar">
    <div class="nav-group">
      <button class="icon-btn" id="nav-back" title="后退">
        <svg viewBox="0 0 20 20"><path d="M12.5 4.5L7 10l5.5 5.5" /></svg>
      </button>
      <button class="icon-btn" id="nav-forward" title="前进">
        <svg viewBox="0 0 20 20"><path d="M7.5 4.5L13 10l-5.5 5.5" /></svg>
      </button>
      <button class="icon-btn" id="nav-reload" title="刷新">
        <svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.76-4.24" /><path d="M16 3.5V6h-2.5" /></svg>
      </button>
      <button class="icon-btn nav-home" id="nav-home" title="主页">
        <svg viewBox="0 0 20 20"><path d="M3.5 9L10 3.5 16.5 9v7.5h-5v-4h-3v4h-5z" /></svg>
      </button>
    </div>

    <div class="omnibox" id="omnibox">
      <span class="ow-lock" id="omni-lock" title="连接安全">
        <svg viewBox="0 0 16 16"><path d="M4.5 7V5.5a3.5 3.5 0 0 1 7 0V7" /><rect x="3" y="7" width="10" height="6.5" rx="1.6" /></svg>
      </span>
      <input id="omni-input" class="ow-input" type="text" spellcheck="false"
             autocomplete="off" placeholder="搜索或输入网址" />
      <button class="ow-btn" id="omni-star" title="加入书签">
        <svg viewBox="0 0 18 18"><path d="M9 2.5l1.9 3.9 4.3.6-3.1 3 .7 4.3L9 12.3 5.2 14.3l.7-4.3-3.1-3 4.3-.6z" /></svg>
      </button>

      <span class="ow-divider"></span>

      <!-- 内核选择：地址栏右侧 -->
      <button class="ow-engine" id="omni-engine" title="选择内核" aria-haspopup="menu" aria-expanded="false">
        <b id="omni-engine-short">CR</b>
        <svg class="ow-caret" viewBox="0 0 12 12"><path d="M3 4.6L6 7.6l3-3" /></svg>
      </button>

      <!-- 内核下拉面板 -->
      <div class="engine-menu" id="engine-menu" role="menu" hidden>
        <div class="em-head">选择内核</div>
        <div class="em-list" id="engine-menu-list"></div>
        <div class="em-foot">点选即切换当前标签页内核，网址与登录态保留；橙色标记为兼容层</div>
      </div>

      <!-- 点地址栏里的网址弹出的分享面板：复制链接 / 复制简介 / 二维码 / 分享到各 App -->
      <!-- 点地址栏网址弹出的分享面板：紧凑版（二维码 + 标题/网址 + 一键复制 + 纯图标分享）。
           复制一次就把「标题 + 简介 + 链接」一起带走，不再拆成两个按钮；
           二维码本地生成，生成失败就整块收起，不留空框。 -->
      <div class="omni-share" id="omni-share" role="dialog" aria-label="分享" hidden>
        <div class="os-qrwrap" id="os-qrwrap" hidden>
          <img id="os-qr" alt="本页二维码" />
        </div>
        <div class="os-meta">
          <div class="os-title" id="os-title">—</div>
          <div class="os-url" id="os-url">—</div>
        </div>
        <button class="os-copy" data-share="copy" title="复制标题、简介和链接">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.2 11.8a3 3 0 0 1 0-4.2l1.8-1.8a3 3 0 0 1 4.2 4.2l-.9.9"/><path d="M11.8 8.2a3 3 0 0 1 0 4.2l-1.8 1.8a3 3 0 0 1-4.2-4.2l.9-.9"/></svg>
          <span>复制链接和简介</span>
        </button>
        <div class="os-sep">分享到</div>
        <div class="os-icons" role="group" aria-label="分享到">
          <button class="os-icon" data-share="wechat" title="微信（扫码）" aria-label="微信">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.6 3.6C4.8 3.6 2.6 5.5 2.6 7.8c0 1.3.8 2.5 2 3.2l-.5 1.9 2.1-1.1c.5.1 1 .2 1.4.2 2.8 0 5-1.9 5-4.2s-2.2-4.2-5-4.2z"/><path d="M13.2 7.6c2.5 0 4.6 1.6 4.6 3.7 0 1.1-.6 2.1-1.6 2.7l.4 1.6-1.8-.9c-.4.1-.9.2-1.3.2-2.6 0-4.6-1.7-4.6-3.8s2-3.5 4.6-3.5z"/></svg>
          </button>
          <button class="os-icon" data-share="weibo" title="微博" aria-label="微博">
            <svg viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="8.5" cy="11" rx="5.5" ry="4"/><path d="M12.8 4.2c2.2 0 4 1.6 4 3.6M12.8 6.6c1.1 0 2 .8 2 1.8"/><path d="M5.6 9.4c1.6 0 2.9 1 2.9 2.2s-1.3 2.2-2.9 2.2-2.9-1-2.9-2.2 1.3-2.2 2.9-2.2z"/></svg>
          </button>
          <button class="os-icon" data-share="xhs" title="小红书（复制标题和链接）" aria-label="小红书">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="2.8" width="12" height="14.4" rx="2.2"/><path d="M7.6 7h4.8M7.6 10h4.8M7.6 13h3"/></svg>
          </button>
          <button class="os-icon" data-share="moments" title="朋友圈（扫码）" aria-label="朋友圈">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><circle cx="10" cy="6.6" r="1.3"/><circle cx="6.8" cy="11.4" r="1.3"/><circle cx="12.8" cy="12" r="1.3"/></svg>
          </button>
        </div>
      </div>

      <!-- 打字时的自动匹配下拉：从收藏夹 + 历史记录里补齐网址（行由 JS 填） -->
      <div class="omni-suggest" id="omni-suggest" role="listbox" aria-label="网址建议" hidden></div>
    </div>

    <!-- 下载：地址栏右侧的常驻入口。有下载时弹出一个贴在地址栏旁的小窗，
         展示进行中的任务、进度与暂停/取消/打开等操作；点图标收起或展开。 -->
    <div class="dl-cluster">
      <button class="icon-btn has-badge has-label" id="btn-downloads" title="下载">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0l-3.6-3.6M10 12l3.6-3.6M4 15.6h12" /></svg>
        <span class="ib-label">下载</span>
        <i class="badge" id="dl-count" hidden>0</i>
      </button>
      <div class="dl-popover" id="dl-popover" role="dialog" aria-label="下载" hidden>
        <div class="dl-pop-head">
          <span>下载</span>
          <button class="dl-pop-x" id="dl-pop-close" title="收起">×</button>
        </div>
        <div class="dl-pop-list" id="dl-pop-list"></div>
        <div class="dl-pop-foot">
          <button class="btn btn-sm" id="dl-pop-open-dir">打开文件夹</button>
          <button class="btn btn-sm" id="dl-pop-clear">清除已完成</button>
          <button class="btn btn-sm" id="dl-pop-all">全部下载</button>
        </div>
      </div>
    </div>

    <div class="tool-group">
      <button class="icon-btn has-badge has-label" id="btn-shield" title="广告拦截">
        <svg viewBox="0 0 20 20"><path d="M10 2.5l6 2v5.2c0 3.6-2.5 6.6-6 7.8-3.5-1.2-6-4.2-6-7.8V4.5z" /></svg>
        <span class="ib-label">广告拦截</span>
        <i class="badge" id="shield-count">0</i>
      </button>
      <!-- 媒体嗅探：点按钮弹出贴在下方的小窗（复用下载/扩展小窗的 .dl-popover）。
           内容和设置里的「媒体嗅探」是同一份，只是省掉了页头和长说明；
           底部留一个「在设置里管理」的入口，需要看完整说明时再过去。 -->
      <div class="sniff-cluster">
        <button class="icon-btn has-badge has-label" id="btn-sniff" title="媒体嗅探" aria-expanded="false" aria-haspopup="dialog">
          <svg viewBox="0 0 20 20"><rect x="2.5" y="5" width="9" height="8" rx="1.4" /><path d="M5.5 8.5l2.4 1.5-2.4 1.5z" /><path d="M14 8a3.2 3.2 0 0 1 0 5" /><path d="M16.6 5.8a6.4 6.4 0 0 1 0 9.4" /></svg>
          <span class="ib-label">媒体嗅探</span>
          <i class="badge" id="sniff-count">0</i>
        </button>
        <div class="dl-popover sniff-popover" id="sniff-pop" role="dialog" aria-label="媒体嗅探" hidden>
          <div class="dl-pop-head">
            <span>媒体嗅探</span>
            <button class="dl-pop-x" id="sniff-pop-close" title="收起">×</button>
          </div>
          <div class="dl-pop-list" id="sniff-pop-body"></div>
          <div class="dl-pop-foot">
            <button class="btn btn-sm" id="sniff-pop-manage">在设置里管理</button>
          </div>
        </div>
      </div>
      <!-- 扩展：点图标弹出一个**独立的启用窗口**，就地开关，不必跳进设置。
           它是「快速开关」而不是「管理」—— 详情、移除、安装仍在设置里，
           所以底部留一个入口过去。两件事分开是有意的：管扩展是低频动作，
           开/关扩展是高频动作，而高频动作不该每次都把人送到一整页设置上。
           位置与样式复用下载小窗（.dl-popover）：同一套「贴在按钮下面」的
           交互，两处长得一样才对。 -->
      <div class="ext-cluster">
        <button class="icon-btn has-label" id="btn-ext" title="扩展" aria-expanded="false" aria-haspopup="dialog">
          <svg viewBox="0 0 20 20"><path d="M8 3.5a2 2 0 1 1 4 0h3v3a2 2 0 1 0 0 4v3h-3a2 2 0 1 0-4 0H5v-3a2 2 0 1 0 0-4V3.5z" /></svg>
          <span class="ib-label">扩展</span>
        </button>
        <div class="dl-popover ext-popover" id="ext-popover" role="dialog" aria-label="扩展" hidden>
          <div class="dl-pop-head">
            <span id="ext-pop-title">扩展</span>
            <button class="dl-pop-x" id="ext-pop-close" title="收起">×</button>
          </div>
          <div class="dl-pop-list" id="ext-pop-list"></div>
          <div class="dl-pop-foot">
            <button class="btn btn-sm" id="ext-pop-install">从文件安装</button>
            <button class="btn btn-sm" id="ext-pop-import">从浏览器导入</button>
            <button class="btn btn-sm" id="ext-pop-manage">管理全部扩展</button>
          </div>
        </div>
      </div>
      <button class="icon-btn has-label" id="btn-ai" title="AI 助手">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l1.7 3.9 4.1.4-3.1 2.8.9 4.1L10 16l-3.6 2.1.9-4.1-3.1-2.8 4.1-.4z" /></svg>
        <span class="ib-label">AI</span>
      </button>

      <!-- 自动更新。默认 hidden —— 有新版时才出现，位置在扩展与 AI 之间。
           刻意不给它常驻一格：没更新时它什么也做不了，白占宽度；
           而工具栏每一格都要争宽度（地址栏才是那个真正需要宽度的）。
           图标是箭头绕圈（下载/更新的通用符号），不用「设置」齿轮 ——
           齿轮在这个界面里已经被「菜单」占了。 -->
      <button class="icon-btn has-badge has-label" id="btn-update" title="检查更新" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 3a7 7 0 1 1-6.2 3.7M10 3V1m0 2H8" />
        </svg>
        <span class="ib-label">更新</span>
        <i class="badge" id="update-count" hidden>1</i>
      </button>

      <button class="icon-btn has-label" id="btn-menu" title="菜单">
        <svg viewBox="0 0 20 20"><path d="M3.5 6h13M3.5 10h13M3.5 14h13" /></svg>
        <span class="ib-label">菜单</span>
      </button>
    </div>
  </div>

  <!-- ============ 收藏夹栏 ============ -->
  <!-- 位置写死在这里：地址栏与网页视口之间。再往上就是标签条。
       内容是 JS 渲的（renderBookmarkBar）；显隐由设置项 bookmarkBar 决定，
       走 hidden 属性而不是内联 display —— 后者会跟 [hidden] 的规则打架。
       宽窄两档都渲染这一条，窄档只是样式收窄。 -->
  <!-- 收藏夹栏：条目在 .bm-track 里横向滚；放不下时右侧出现「更多」，
       点开列出全部书签（栏里滚出去的那些也能直接找到）。 -->
  <div class="bookmarkbar" id="bookmark-bar" hidden>
    <div class="bm-track" id="bm-track"></div>
    <button class="bm-more" id="bm-more" type="button" title="更多书签" aria-haspopup="menu" aria-expanded="false" hidden>更多</button>
    <div class="bm-menu" id="bm-menu" role="menu" aria-label="全部书签" hidden></div>
  </div>

  <!-- ============ 内核模式提示 ============ -->
  <div class="engine-notice" id="engine-notice" hidden>
    <span class="en-dot"></span>
    <span class="en-text" id="engine-notice-text"></span>
    <button class="en-close" id="engine-notice-close">知道了</button>
  </div>

  <!-- 页内查找：占布局的一条窄栏，不浮在视口上 ——
       <webview> 是独立原生视图，同层 DOM 的 z-index 盖不住它。 -->
  <div class="findbar" id="findbar" hidden>
    <input id="find-input" placeholder="在页面中查找" spellcheck="false" autocomplete="off" />
    <span class="find-count" id="find-count">0/0</span>
    <button class="find-btn" id="find-prev" title="上一个（Shift+Enter）">↑</button>
    <button class="find-btn" id="find-next" title="下一个（Enter）">↓</button>
    <button class="find-btn find-x" id="find-close" title="关闭（Esc）">×</button>
  </div>

  <!-- ============ 视口 ============ -->
  <main class="viewport" id="viewport">
    <div class="empty-state" id="empty-state" hidden>
      <div class="es-mark">N</div>
      <p class="es-title">没有打开的标签页</p>
      <p class="es-sub">按 + 新建标签页，或切到不同内核试试</p>
    </div>
    <!-- 网页加载失败时的提示页（此前会是一片空白） -->
    <div class="page-error" id="page-error" hidden>
      <div class="pe-mark">!</div>
      <p class="pe-title" id="pe-title">无法打开此网页</p>
      <p class="pe-url" id="pe-url">—</p>
      <p class="pe-reason" id="pe-reason"></p>
      <div class="pe-actions">
        <button class="btn btn-primary" id="pe-retry">重试</button>
        <button class="btn" id="pe-home">回到首页</button>
      </div>
    </div>
  </main>

  <!-- ============ 移动端底栏 ============ -->
  <nav class="mobilebar">
    <button class="mb-btn" id="mb-back">
      <svg viewBox="0 0 20 20"><path d="M12.5 4.5L7 10l5.5 5.5" /></svg><span>后退</span>
    </button>
    <button class="mb-btn" id="mb-forward">
      <svg viewBox="0 0 20 20"><path d="M7.5 4.5L13 10l-5.5 5.5" /></svg><span>前进</span>
    </button>
    <button class="mb-btn mb-primary" id="mb-tabs">
      <svg viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12" rx="2" /><path d="M6.5 2.5h7" /></svg><span id="mb-tab-count">1</span>
    </button>
    <button class="mb-btn" id="mb-engine">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" /><path d="M10 3.5v13M3.5 10h13" /></svg><span id="mb-engine-label">Chromium</span>
    </button>
    <button class="mb-btn" id="mb-read">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.2" /><path d="M2.5 10S5.5 5 10 5s7.5 5 7.5 5-3 5-7.5 5-7.5-5-7.5-5z" /></svg><span>阅读</span>
    </button>
    <button class="mb-btn" id="mb-menu">
      <svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h12" /></svg><span>菜单</span>
    </button>
  </nav>

  <!-- ============ 设置（窗口，左导航 + 右内容） ============
       外层 .settings-view 是定位层兼暗底，内层 .sv-window 才是那扇窗。
       分两层是因为「居中 + 留边距」得由父级给：窗自己写 margin: auto 在
       内容比窗口高的时候会把上边距吃掉，滚到顶时标题栏贴着屏幕边缘。
       窗口外壳叫 .sv-window 而不是 .sv-card —— 后者已经被分区内部那些
       分组卡占用了（见 shell.css 的「设置页里的分组卡」），重名会让
       所有卡片一起变成窗口。 -->
  <section class="settings-view" id="settings-view" hidden>
    <div class="sv-window">
      <header class="sv-head">
        <button class="icon-btn" id="sv-back" title="返回">
          <svg viewBox="0 0 20 20"><path d="M12.5 4.5L7 10l5.5 5.5" /></svg>
        </button>
        <h1 class="sv-title">设置</h1>
        <span class="sv-path" id="sv-path">常规</span>
        <div class="sv-fill"></div>
        <button class="icon-btn" id="sv-close" title="关闭设置">
          <svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" /></svg>
        </button>
      </header>
      <div class="sv-body">
        <nav class="sv-nav" id="settings-nav"></nav>
        <main class="sv-main" id="settings-body"></main>
      </div>
    </div>
  </section>

  <!-- ============ 侧边抽屉（仅菜单） ============ -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <header class="drawer-head">
      <h2 id="drawer-title">菜单</h2>
      <button class="icon-btn" id="drawer-close" title="关闭">
        <svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" /></svg>
      </button>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- ============ 二维码弹层（分享到桌面无 API 的 App：微信/朋友圈等扫码桥接） ============ -->
  <!-- ============ AI 助手（右侧滑出） ============
       内嵌网页对话：右侧下拉选 AI，输入框内容发送后带入该 AI 的网页对话，
       结果就显示在这块 webview 里。免登录的排最前；另有「自定义」入口。
       不接任何密钥、不走后端，纯 web。 -->
  <aside class="ai-panel" id="ai-panel" aria-hidden="true">
    <header class="ai-head">
      <h2>AI 助手</h2>
      <button class="ai-x" id="ai-close" title="关闭">×</button>
    </header>
    <div class="ai-body">
      <webview id="ai-webview" class="ai-webview" allowpopups partition="persist:nova-chromium"></webview>
      <!-- API 模式：内嵌网页常被对方识别成「环境异常」拒绝渲染，这里改走自己的 API 请求 -->
      <div class="ai-api" id="ai-api" hidden>
        <div class="ai-api-cfg">
          <input id="ai-api-base" class="ai-input" placeholder="API 地址，如 https://api.deepseek.com" spellcheck="false" />
          <div class="ai-api-cfg-row">
            <input id="ai-api-key" class="ai-input" type="password" placeholder="API Key（sk-…）" spellcheck="false" />
            <input id="ai-api-model" class="ai-input" placeholder="模型，如 deepseek-chat" spellcheck="false" />
          </div>
        </div>
        <div class="ai-chat" id="ai-chat"></div>
      </div>
    </div>
    <div class="ai-foot">
      <div class="ai-row">
        <select id="ai-select" class="ai-select" title="选择 AI">
          <option value="deepseek">DeepSeek（免登录）</option>
          <option value="kimi">Kimi（免登录）</option>
          <option value="qwen">通义千问（免登录）</option>
          <option value="doubao">豆包（免登录）</option>
          <option value="api">API（DeepSeek 等，需 Key）</option>
          <option value="custom">自定义…</option>
        </select>
        <button class="btn btn-sm" id="ai-grab" title="把当前页选中的文字带进来">带入当前页</button>
      </div>
      <div class="ai-custom" id="ai-custom" hidden>
        <input id="ai-custom-url" class="ai-input" placeholder="自定义 AI 对话地址（https://…）" spellcheck="false" />
      </div>
      <textarea id="ai-text" class="ai-text" placeholder="输入内容，选好 AI 后点「发送」"></textarea>
      <div class="ai-actions" id="ai-actions">
        <button class="btn btn-primary" id="ai-send">发送</button>
        <button class="btn" id="ai-clear">清空</button>
      </div>
      <div class="ai-note">网页对话免登录优先，直接在页面里输入即可；API 模式用你自己的 Key（只存本机设置，请求由本机直发）</div>
    </div>
  </aside>

  <!-- ============ 扩展界面承载面板（侧边栏 / 弹窗型扩展的 UI 出口） ============ -->
  <!-- Electron 不渲染扩展侧边栏与浏览器动作弹窗，side_panel 型扩展（豆包/Cici、
       DeepSider 等）装上了也「点不出来」。这个面板用同分区 webview 打开扩展自己的
       side_panel.html / popup.html / options.html，让这类扩展在 Nova 里真正可用。
       位置与滑入方式复用 AI 面板那一套（右侧停靠）。 -->
  <aside class="ext-ui-panel" id="ext-ui-panel" aria-hidden="true" hidden>
    <header class="ext-ui-head">
      <div class="ext-ui-title">
        <img class="ext-ui-icon" id="ext-ui-icon" alt="" hidden />
        <h2 id="ext-ui-name">扩展</h2>
      </div>
      <button class="ext-ui-x" id="ext-ui-close" title="关闭">×</button>
    </header>
    <div class="ext-ui-body">
      <webview id="ext-ui-webview" class="ext-ui-webview" allowpopups partition="persist:nova-chromium"></webview>
    </div>
  </aside>

  <!-- ============ 自动更新面板 ============ -->
  <!-- 与 AI 面板同一套视觉语言（右侧滑入），复用 .drawer 的定位方式。
       内容由 syncUpdateBlocks() 按状态重画，不在这里写死 —— 状态有
       idle / checking / available / downloading / ready / error 六档，
       写死在 HTML 里的话改一档要动两处。

       data-up-block：**同一个更新状态会同时显示在多个地方**（这个小窗、
       设置里的「关于」分区）。这个标记就是「我这里显示更新状态」的意思，
       syncUpdateBlocks() 会一次全画。加新的显示位置时记得也标上，
       否则那一处会在下载时僵住（这正是「关于」那一页踩过的坑）。 -->
  <aside class="up-panel" id="update-panel" aria-hidden="true" hidden>
    <div class="up-head">
      <span>更新</span>
      <button class="ai-x" id="update-close" title="关闭">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
      </button>
    </div>
    <div class="up-body" id="update-body" data-up-block></div>
  </aside>

  <!-- ============ 移动端标签页总览 ============ -->
  <section class="tab-grid" id="tab-grid" hidden>
    <header class="tg-head">
      <h2>标签页 <span id="tg-count">1</span></h2>
      <input id="tg-search" class="tg-search" type="text" placeholder="搜索标签页（标题或网址）" spellcheck="false" autocomplete="off" />
      <button class="icon-btn" id="tg-close" title="关闭">
        <svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" /></svg>
      </button>
    </header>
    <div class="tg-list" id="tg-list"></div>
    <button class="tg-new" id="tg-new">+ 新建标签页</button>
  </section>

  <!-- ============ 内核切换底部弹层（移动端） ============ -->
  <div class="sheet" id="engine-sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-grip"></div>
      <h3>选择内核</h3>
      <div class="engine-cards" id="engine-cards"></div>
    </div>
  </div>

  <!-- ============ 阅读增强底部弹层（移动端） ============ -->
  <div class="sheet" id="read-sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-grip"></div>
      <h3>阅读增强</h3>
      <div id="read-sheet-body"></div>
    </div>
  </div>

  <!-- 拖入扩展时的提示遮罩。
       整块铺在视口上、压在最上面（z-index 高），带一圈虚线边与文件类型提示。
       默认 hidden，由 wireDropInstall() 在 dragenter/dragover 时打开、
       dragleave/drop 时收起。刻意用 [hidden] 而不是内联 display ——
       后者会和下面的 CSS 规则打架（这个页面里其它几个浮层都踩过这个）。 -->
  <div class="drophint" id="drop-hint" hidden>
    <div class="dh-inner">
      <div class="dh-ico">↓</div>
      <div class="dh-title">松手即可安装扩展</div>
      <div class="dh-sub">支持 .crx / .crx3 / .zip / .xpi</div>
    </div>
  </div>

  <!-- 自动安装前的倒计时条。
       为什么需要它：自动更新最后一步是**重启浏览器去装**，而重启会丢掉
       当前页面里没保存的内容。下载完就立刻退，用户连看清楚发生了什么的机会
       都没有 —— 所以给一个可见的倒计时窗口，想留的可以喊停。
       不能用 toast 代替：那是单例元素，别的提示一来就被顶掉了，
       而这一条是「再有 8 秒就要重启」的事，被顶掉等于没提示。 -->
  <div class="upnow" id="update-now" hidden>
    <span class="un-dot"></span>
    <span class="un-text">更新已就绪，<b id="update-now-sec">8</b> 秒后重启安装</span>
    <button class="un-btn" id="update-now-later">稍后</button>
    <button class="un-btn un-btn-go" id="update-now-go">立即重启</button>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="ntp.js"></script>
<script src="bridge-mock.js"></script>
<script src="autopage.js"></script>
<script src="shell.js"></script>
</body>
</html>
