<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>AI 助手 · 吾爱Nova浏览器</title>
<!-- 独立窗口也走 contextIsolation + preload：页面里没有任何 Node，
     脚本只用本地文件，样式同理。

     style-src 里的 'unsafe-inline' **不能删**，它不是图省事：
     Chromium 给 <webview> 元素定尺寸走的是内联样式，缺了它就被这条 CSP
     挡掉，guest 会一直停在默认的 300x150 上 —— 宿主元素怎么拉伸，页面
     都只画出顶上那一条，也就是「AI 窗口最大化后界面只显示一半」。
     实测（Electron 40.10.6）：同一份页面只把 'unsafe-inline' 加回来，
     guest 就跟着最大化 / 还原 / 拖动缩放一路跟上（726→667→507 一路同值）；
     去掉就立刻退回 150，换 flex / 绝对定位等任何布局写法都没用。
     shell.html 的 CSP 一直带着 'unsafe-inline'，所以主界面里那几个
     webview（AI 面板、扩展面板、打印预览）没有这个问题。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
<!-- 复用外壳那份样式表：设计令牌（:root / [data-theme="dark"]）与 .btn 等
     基础控件都从那里来，本页只补自己的布局（ai-window.css），
     这样独立窗口和主界面是同一套语言。 -->
<link rel="stylesheet" href="shell.css" />
<link rel="stylesheet" href="ai-window.css" />
</head>
<body>
<div class="aw-app" id="aw-app">
  <header class="aw-head">
    <span class="brand-mark" aria-hidden="true">N</span>
    <strong class="aw-title">AI 助手</strong>
    <span class="aw-src" id="aw-src">独立窗口</span>
    <div class="aw-head-btns">
      <button class="btn btn-sm" id="aw-toggle-cfg" title="API 设置">API 设置</button>
      <button class="btn btn-sm" id="aw-back" title="关掉这个窗口，回到侧边栏">回到侧边栏</button>
    </div>
  </header>

  <!-- API 配置：默认收起。配置是侧栏带过来的，这里只是让你能临时改。 -->
  <div class="aw-cfg" id="aw-cfg" hidden>
    <input id="aw-base" class="aw-field" placeholder="API 地址，如 https://api.deepseek.com" spellcheck="false" />
    <input id="aw-key" class="aw-field" type="password" placeholder="API Key（sk-…）" spellcheck="false" />
    <input id="aw-model" class="aw-field" placeholder="模型，如 deepseek-chat" spellcheck="false" />
  </div>

  <!-- 网页模式：与浏览器主窗口共用 persist:nova-chromium 分区 ——
       cookie / localStorage 都在磁盘上，AI 站点认得出你，历史会话也在。
       这是「搬到新窗口却不丢画面」的第一半。 -->
  <webview id="aw-webview" class="aw-webview" allowpopups partition="persist:nova-chromium"></webview>

  <!-- API 模式：对话是自己的，整份消息由侧栏传过来，一条不丢 -->
  <div class="aw-api" id="aw-api" hidden>
    <div class="aw-chat" id="aw-chat"></div>
    <div class="aw-note" id="aw-hint"></div>
    <div class="aw-foot">
      <textarea id="aw-text" class="aw-input" placeholder="输入内容，回车发送（Shift + 回车换行）"></textarea>
      <div class="aw-actions">
        <button class="btn btn-primary" id="aw-send">发送</button>
        <button class="btn" id="aw-clear">清空</button>
      </div>
    </div>
  </div>
</div>
<script src="ai-window.js"></script>
</body>
</html>
